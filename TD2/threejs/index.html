<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TD2 Three.js</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #orientation-controls {
            position: fixed;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            z-index: 1;
            max-width: 22rem;
            padding: 1rem;
            border-radius: 0.5rem;
            background: rgba(255, 255, 255, 0.95);
            color: #222;
            font-family: sans-serif;
        }

        #enable-orientation {
            min-height: 44px;
            padding: 0.5rem 1rem;
            font: inherit;
            cursor: pointer;
        }

        #orientation-status {
            margin: 0.75rem 0 0;
            line-height: 1.4;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="orientation-controls">
        <button id="enable-orientation" type="button">Activer le contrôle par le téléphone</button>
        <p id="orientation-status" role="status">Appuie sur le bouton, puis incline ton téléphone pour faire tourner le cube.</p>
    </div>

    <script type="module" src="main.js"></script>

</body>

</html>
